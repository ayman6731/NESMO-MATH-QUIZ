<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التميز التفاعلية - أولمبياد نسمو</title>
    <style>
        :root {
            --primary: #1a237e;
            --secondary: #303f9f;
            --accent: #ffb300;
            --exam: #c62828;
            --bg: #e8eaf6;
            --text: #212121;
            --success: #2e7d32;
            --error: #b71c1c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            width: 100%;
            text-align: center;
            padding: 25px 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        header h1 { margin: 0; font-size: 32px; }
        header p { margin: 8px 0 0; color: var(--accent); font-weight: bold; font-size: 18px; }
        
        .container {
            width: 95%;
            max-width: 850px;
            margin: 30px auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        
        .dashboard { display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .categories-grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; width: 100%; }
        
        .category-card {
            background: var(--primary);
            color: white;
            width: 46%;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            font-size: 18px;
            font-weight: bold;
            border: none;
        }
        .category-card:hover { transform: translateY(-5px); background: var(--secondary); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        .exam-card {
            background: linear-gradient(135deg, #c62828, #e53935);
            color: white;
            width: 95%;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            font-size: 22px;
            font-weight: bold;
            border: 2px solid #b71c1c;
            box-shadow: 0 5px 15px rgba(198, 40, 40, 0.4);
            animation: pulse 2s infinite;
        }
        .exam-card:hover { transform: scale(1.02); }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(198, 40, 40, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(198, 40, 40, 0); }
            100% { box-shadow: 0 0 0 0 rgba(198, 40, 40, 0); }
        }

        #timer-container {
            display: none;
            background: var(--text);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            margin: 0 auto 20px auto;
            text-align: center;
            width: fit-content;
            letter-spacing: 2px;
        }
        .timer-warning { background: var(--error) !important; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        
        #quiz-section { display: none; }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .category-badge {
            background: var(--accent);
            color: var(--primary);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }
        .question-text { font-size: 22px; font-weight: bold; margin-bottom: 25px; line-height: 1.6; color: #1a237e; direction: rtl; text-align: right; }
        
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            padding: 16px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            text-align: right;
            transition: 0.2s;
            font-family: inherit;
            font-weight: 500;
        }
        .option-btn:hover:not(:disabled) { background: #e8eaf6; border-color: var(--primary); }
        .option-btn.correct { background: #c8e6c9; border-color: var(--success); color: var(--success); font-weight: bold; }
        .option-btn.wrong { background: #ffcdd2; border-color: var(--error); color: var(--error); }
        
        .feedback {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            display: none;
            font-size: 16px;
            line-height: 1.6;
        }
        .feedback.show { display: block; animation: fadeIn 0.5s; }
        .feedback-success { background: #e8f5e9; border-right: 6px solid var(--success); }
        .feedback-error { background: #ffebee; border-right: 6px solid var(--error); }
        
        .controls { margin-top: 30px; display: flex; justify-content: space-between; }
        .nav-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .nav-btn:hover { background: var(--secondary); }
        .nav-btn.next { background: var(--accent); color: var(--text); }
        .nav-btn.next:hover { background: #ffca28; }
        
        #result-section { display: none; text-align: center; }
        .score-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: white;
            color: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            font-weight: bold;
            margin: 30px auto;
            border: 8px solid var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .score-circle span { font-size: 20px; color: #757575; margin-top: -10px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <h1>منصة التميز التفاعلية - أولمبياد نسمو</h1>
        <p>إعداد المعلم الخبير: أيمن صابر أحمد</p>
    </header>

    <div class="container">
        <div id="dashboard" class="dashboard">
            <button class="exam-card" onclick="startExam()">🏆 بدء الاختبار الشامل (مؤقت ومحسوب الدرجات) 🏆</button>
            <h3 style="margin: 5px 0; color: #5c6bc0;">أو تدرب حسب القسم (متجدد تلقائياً):</h3>
            <div class="categories-grid">
                <button class="category-card" onclick="startPractice('algebra')">الجبر المتقدم</button>
                <button class="category-card" onclick="startPractice('geometry')">الهندسة والتشابه</button>
                <button class="category-card" onclick="startPractice('number_theory')">نظرية الأعداد</button>
                <button class="category-card" onclick="startPractice('combinatorics')">التركيبات ومبادئ العد</button>
            </div>
        </div>

        <div id="timer-container">⏱️ <span id="time-left">20:00</span></div>

        <div id="quiz-section">
            <div class="question-header">
                <span id="q-category" class="category-badge">القسم</span>
                <span id="q-counter">السؤال 1</span>
            </div>
            <div id="q-text" class="question-text">نص السؤال هنا</div>
            <div id="options-container" class="options"></div>
            <div id="feedback-box" class="feedback">
                <strong id="feedback-title"></strong><br>
                <span id="feedback-text"></span>
            </div>
            <div class="controls">
                <button class="nav-btn" onclick="forceEndExam()">إنهاء / العودة</button>
                <button id="next-btn" class="nav-btn next" onclick="nextQuestion()" style="display:none;">السؤال التالي ⬅️</button>
            </div>
        </div>

        <div id="result-section">
            <h2 id="result-title">نتيجة الاختبار</h2>
            <div class="score-circle">
                <div id="final-score">0%</div>
                <span id="score-fraction">0/0</span>
            </div>
            <h3 id="result-msg" style="line-height: 1.6; padding: 0 20px;"></h3>
            <div style="display: flex; gap: 15px; justify-content: center; margin-top: 30px;">
                <button class="nav-btn" onclick="goHome()">الرئيسية</button>
                <button class="nav-btn next" onclick="startExam()">إعادة الاختبار للتحسين 🔄</button>
            </div>
        </div>
    </div>

    <script>
        /* البنك الشامل والموسع (مستخرج حصرياً من حقيبة نسمو المعتمدة) */
        const questionBank = {
            algebra: [
                { q: "إذا كانت 120% من عدد ما هي 36، فما هو هذا العدد؟", options: [{text:"30", isCorrect:true}, {text:"25", isCorrect:false}, {text:"40", isCorrect:false}, {text:"43.2", isCorrect:false}], hint: "بتبسيط 120/100 إلى 6/5، تصبح 6س/5 = 36، إذن س = 30." },
                { q: "تحول سعر سلعة من 2890 ريالاً إلى 2023 ريالاً. ما هي نسبة التخفيض؟", options: [{text:"30%", isCorrect:true}, {text:"25%", isCorrect:false}, {text:"35%", isCorrect:false}, {text:"40%", isCorrect:false}], hint: "مقدار النقص هو 867. النسبة = (867 / 2890) × 100 = 30%." },
                { q: "أحضرت نورا 60 قطعة بسكويت، أعطت معلماتها 40% منها، و 25% من الباقي لصديقاتها، وأكلت ثلث ما تبقى. كم قطعة بقيت معها؟", options: [{text:"18 قطعة", isCorrect:true}, {text:"15 قطعة", isCorrect:false}, {text:"20 قطعة", isCorrect:false}, {text:"24 قطعة", isCorrect:false}], hint: "للمعلمات 24 (يتبقى 36). للصديقات 25% من 36 = 9 (يتبقى 27). أكلت الثلث يعني 9، فالباقي النهائي 18." },
                { q: "إذا كانت النسبة بين قياس زوايا خماسي هي 2 : 3 : 4 : 5 : 6، فما قياس الزاوية الكبرى؟", options: [{text:"162 درجة", isCorrect:true}, {text:"150 درجة", isCorrect:false}, {text:"144 درجة", isCorrect:false}, {text:"172 درجة", isCorrect:false}], hint: "مجموع زوايا الخماسي 540 درجة. مجموع الأجزاء = 20. قيمة الجزء = 540 ÷ 20 = 27. الزاوية الكبرى = 6 × 27 = 162 درجة." },
                { q: "زيد طول مستطيل بنسبة 50% وعرضه بنسبة 20%. ما نسبة الزيادة في مساحته؟", options: [{text:"80%", isCorrect:true}, {text:"70%", isCorrect:false}, {text:"100%", isCorrect:false}, {text:"60%", isCorrect:false}], hint: "المساحة الجديدة = 1.5 الطول × 1.2 العرض = 1.80 من المساحة الأصلية. أي أن الزيادة هي 80%." },
                { q: "في كل يوم 20% من السمك يباع. إذا بقي 2000 سمكة نهاية يوم الثلاثاء، كم كان العدد بداية يوم الإثنين؟", options: [{text:"3125 سمكة", isCorrect:true}, {text:"2500 سمكة", isCorrect:false}, {text:"3000 سمكة", isCorrect:false}, {text:"4000 سمكة", isCorrect:false}], hint: "المتبقي كل يوم هو 80% (أو 0.8). إذن 0.8 × 0.8 × س = 2000. أي 0.64 س = 2000، ومنها س = 3125." },
                { q: "عددان مجموعهما 42 والفرق بينهما 8، فما هو العدد الأكبر؟", options: [{text:"25", isCorrect:true}, {text:"17", isCorrect:false}, {text:"21", isCorrect:false}, {text:"34", isCorrect:false}], hint: "لإيجاد الأكبر، نجمع (المجموع + الفرق) ونقسم على 2. (42+8)/2 = 25." },
                { q: "حل النظام: س + ص = 13، وَ س - ص = 7. أوجد قيمة س؟", options: [{text:"10", isCorrect:true}, {text:"3", isCorrect:false}, {text:"20", isCorrect:false}, {text:"6", isCorrect:false}], hint: "بجمع المعادلتين تختفي ص: 2س = 20، إذن س = 10." },
                { q: "حل النظام: س + ص = 14، وَ س - ص = 2. أوجد قيمة س؟", options: [{text:"8", isCorrect:true}, {text:"6", isCorrect:false}, {text:"16", isCorrect:false}, {text:"12", isCorrect:false}], hint: "بجمع المعادلتين: 2س = 16، إذن س = 8." },
                { q: "حل نظام المعادلات: x + y = 8, y + z = 4, z + x = 6. أوجد قيمة x؟", options: [{text:"5", isCorrect:true}, {text:"3", isCorrect:false}, {text:"1", isCorrect:false}, {text:"4", isCorrect:false}], hint: "بجمع المعادلات الثلاث: 2(x+y+z) = 18، إذن x+y+z = 9. وبما أن y+z = 4، فإن x = 9 - 4 = 5." },
                { q: "إذا كان (a, b, c) أعداداً ثابتة موجبة، وحل المعادلة: (x - a - b)/c + (x - b - c)/a + (x - c - a)/b = 3، فما هي قيمة x؟", options: [{text:"x = a + b + c", isCorrect:true}, {text:"x = abc", isCorrect:false}, {text:"x = 1", isCorrect:false}, {text:"لا يوجد حل حقيقي", isCorrect:false}], hint: "بإرجاع الـ 3 كـ (-1) لكل كسر وتوحيد المقامات، يظهر البسط (x - a - b - c) كعامل مشترك. بمساواته بالصفر نجد أن x = a + b + c." },
                { q: "نظام المعادلات: kx - y = -1/3 وَ 3y = 1 - 6x. ما قيمة k التي تجعل النظام ليس له حل؟", options: [{text:"لا توجد قيمة لـ k", isCorrect:true}, {text:"k = -2", isCorrect:false}, {text:"k = 2", isCorrect:false}, {text:"k = 1/2", isCorrect:false}], hint: "بقسمة الثانية على -3 نجد -2x - y = -1/3. إذا كانت k = -2 فالمعادلتان متطابقتان (عدد لا نهائي من الحلول). لذا يستحيل إيجاد قيمة تجعلهما متوازيين فقط (بدون حل)." },
                { q: "لدينا العدد 1234512345123451234512345. إذا كان بإمكانك إزالة عشر خانات منه، فما أكبر عدد يمكنك الحصول عليه؟", options: [{text:"553451234512345", isCorrect:true}, {text:"543215432154321", isCorrect:false}, {text:"555551234512345", isCorrect:false}, {text:"533451234512345", isCorrect:false}], hint: "لجعل العدد أكبر ما يمكن، نحذف الخانات الصغيرة من اليسار. نحذف (1234) ليصبح الأول 5، ثم نحذف (1234) التالية ليصبح الثاني 5، يتبقى 553451234512345." }
            ],
            geometry: [
                { q: "النسبة بين مساحتي مضلعين متشابهين تساوي 16 : 25. ما هي نسبة التشابه بين المحيطين؟", options: [{text:"4 : 5", isCorrect:true}, {text:"8 : 12.5", isCorrect:false}, {text:"16 : 25", isCorrect:false}, {text:"256 : 625", isCorrect:false}], hint: "نسبة المحيطات هي نفس نسبة الأضلاع (النسبة الخطية). ونسبة المساحات هي المربع. إذن نأخذ الجذر التربيعي لـ 16:25 لنحصل على 4:5." },
                { q: "هل يتشابه مثلثان متطابقا الأضلاع؟", options: [{text:"دائماً متشابهان", isCorrect:true}, {text:"أحياناً متشابهان", isCorrect:false}, {text:"التشابه مستحيل", isCorrect:false}, {text:"فقط إذا تساوت المساحة", isCorrect:false}], hint: "المثلثات متطابقة الأضلاع زواياها دائماً 60 درجة، ولتطابق الزوايا (AAA) فهما دائماً متشابهان." },
                { q: "هل المربعان متشابهان دائماً؟", options: [{text:"دائماً متشابهان", isCorrect:true}, {text:"أحياناً متشابهان", isCorrect:false}, {text:"مستحيل", isCorrect:false}, {text:"لا توجد معلومات كافية", isCorrect:false}], hint: "المربعات زواياها 90 درجة دائماً وأضلاعها متناسبة، لذا فهي دائماً متشابهة." },
                { q: "هل يتشابه مثلث قائم الزاوية ومثلث حاد الزوايا؟", options: [{text:"التشابه مستحيل", isCorrect:true}, {text:"دائماً", isCorrect:false}, {text:"أحياناً", isCorrect:false}, {text:"إذا تساوت المساحة", isCorrect:false}], hint: "التشابه (AAA) يتطلب تساوي الزوايا. أحدهما به زاوية 90 والآخر زواياه أقل من 90، فمن المستحيل أن تتطابق." },
                { q: "في تقدير ارتفاع عمود سلة، انطبقت نهاية ظل لاعب (طوله 2م) مع ظل العمود. ظل اللاعب 1.6م ومسافته للعمود 2.8م. ما طول العمود؟", options: [{text:"5.5 م", isCorrect:true}, {text:"4.4 م", isCorrect:false}, {text:"6.2 م", isCorrect:false}, {text:"7.1 م", isCorrect:false}], hint: "ظل العمود الكلي = 1.6 + 2.8 = 4.4م. بالتشابه: طول العمود / 2 = 4.4 / 1.6. طول العمود = 5.5 متر." },
                { q: "إذا كان طول صورة بناية في الفيلم 0.55 سم وطولها على الشاشة 2.2 م. والمسافة بين المصباح والشاشة 24 م. فكم المسافة بين المصباح والفيلم؟", options: [{text:"6 سم", isCorrect:true}, {text:"5.5 سم", isCorrect:false}, {text:"0.22 سم", isCorrect:false}, {text:"4.4 سم", isCorrect:false}], hint: "بالتشابه: (المسافة للفيلم / 2400 سم) = (0.55 سم / 220 سم). المسافة = (0.55 × 2400) / 220 = 6 سم." },
                { q: "على الشكل، النهر حوافه متوازية، IV = 63 م، VE = 20 م، BE = 15 م. أوجد عرض النهر IR.", options: [{text:"47.25 م", isCorrect:true}, {text:"45.5 م", isCorrect:false}, {text:"50 م", isCorrect:false}, {text:"42.75 م", isCorrect:false}], hint: "باستخدام تشابه المثلثين: IR / 15 = 63 / 20. إذن IR = (15 × 63) / 20 = 47.25 متر." },
                { q: "مربع مكون من 5 مستطيلات متطابقة المحيط. ما النسبة بين مساحة أحد المستطيلات المظللة ومساحة أحد المستطيلات غير المظللة؟", options: [{text:"3 : 7", isCorrect:true}, {text:"1 : 2", isCorrect:false}, {text:"4 : 9", isCorrect:false}, {text:"2 : 5", isCorrect:false}], hint: "بفرض أبعاد المستطيلات وتوحيد المحيط داخل المربع، نصل من خلال حل المعادلات الجبرية للأبعاد إلى أن النسبة هي 3 : 7." },
                { q: "إذا رسم مستقيم يوازي ضلعاً من أضلاع المثلث ويقطع الضلعين الآخرين، فإنه:", options: [{text:"يقسمهما إلى قطع أطوالها متناسبة", isCorrect:true}, {text:"يقسمهما إلى قطع متساوية", isCorrect:false}, {text:"ينصف الزاوية المقابلة", isCorrect:false}, {text:"لا يغير من خصائص المثلث", isCorrect:false}], hint: "هذا نص نظرية طالس الأساسية للتشابه (نظرية 7 في الحقيبة)." },
                { q: "في مثلثين متشابهين، إذا كان ارتفاع الأول نصف ارتفاع الثاني، فما العلاقة بين مساحتيهما؟", options: [{text:"مساحة الأول ربع مساحة الثاني", isCorrect:true}, {text:"المساحة تتنصف", isCorrect:false}, {text:"متساويتان", isCorrect:false}, {text:"لا علاقة بينهما", isCorrect:false}], hint: "نسبة الارتفاعات (1/2) تمثل نسبة التشابه. نسبة المساحات هي مربع نسبة التشابه، إذن (1/2)² = 1/4 (الربع)." }
            ],
            number_theory: [
                { q: "إذا جمعنا عددين فرديين، فإن الناتج عدد:", options: [{text:"زوجي", isCorrect:true}, {text:"فردي", isCorrect:false}, {text:"أولي", isCorrect:false}, {text:"مؤلف", isCorrect:false}], hint: "مثال: 3 + 5 = 8. مجموع أي عددين فرديين يعطي دائماً عدداً زوجياً." },
                { q: "إذا جمعنا عددين زوجيين، فإن الناتج عدد:", options: [{text:"زوجي", isCorrect:true}, {text:"فردي", isCorrect:false}, {text:"أولي", isCorrect:false}, {text:"مؤلف", isCorrect:false}], hint: "مجموع أي عددين زوجيين هو عدد زوجي." },
                { q: "إذا كان ناتج ضرب أعداد صحيحة هو عدد فردي، فإن جميع تلك الأعداد يجب أن تكون:", options: [{text:"فردية", isCorrect:true}, {text:"زوجية", isCorrect:false}, {text:"أولية", isCorrect:false}, {text:"مختلفة", isCorrect:false}], hint: "لعبة الثقب الأسود: لو وجد عدد زوجي واحد فقط في عملية الضرب لكان الناتج زوجياً. لكي يكون الناتج فردياً يجب أن تكون جميعها فردية." },
                { q: "مجموع 100 عدد صحيح موجب هو 10000، وعدد الأعداد الفردية فيها أكثر من الزوجية. ما أكبر عدد ممكن للأعداد الزوجية؟", options: [{text:"48", isCorrect:true}, {text:"49", isCorrect:false}, {text:"50", isCorrect:false}, {text:"47", isCorrect:false}], hint: "الزوجية أقل من 50. لو كانت الزوجية 49 ستكون الفردية 51 (مجموعها فردي)، وهذا يناقض أن المجموع 10000 (زوجي). إذن أكبر عدد يحافظ على المجموع الزوجي هو 48." },
                { q: "ثلاثة أعداد أولية p, q, r تحقق p + q = r و p < q. ما هي قيمة p؟", options: [{text:"2", isCorrect:true}, {text:"3", isCorrect:false}, {text:"5", isCorrect:false}, {text:"لا يمكن التحديد", isCorrect:false}], hint: "لكي نجمع عددين أوليين ويكون الناتج أولياً (فردياً)، يجب أن يكون أحدهما زوجياً. الأولي الزوجي الوحيد والأصغر هو 2." },
                { q: "إذا كان p^3 + 5 عدداً أولياً، فإن p^5 + 7 سيكون عدداً:", options: [{text:"مؤلفاً", isCorrect:true}, {text:"أولياً", isCorrect:false}, {text:"زوجياً", isCorrect:false}, {text:"لا يمكن التحديد", isCorrect:false}], hint: "إذا كان p فردياً فإن p³+5 سيكون زوجياً (مرفوض لأنه أولي). إذن p يجب أن يكون 2. وعندها 2⁵+7 = 39 وهو عدد مؤلف." },
                { q: "إذا كان n عدد صحيح موجب بحيث n+3 و n+7 عددان أوليان، أوجد باقي قسمة n على 3.", options: [{text:"1", isCorrect:true}, {text:"0", isCorrect:false}, {text:"2", isCorrect:false}, {text:"لا يمكن التحديد", isCorrect:false}], hint: "لو كان باقي n هو 0 فإن n+3 يقبل على 3. لو كان الباقي 2 فإن n+7 يقبل على 3. إذن الباقي الوحيد الذي يبقيهما أوليين هو 1." },
                { q: "أصغر عدد مؤلف في الأعداد الصحيحة الموجبة هو:", options: [{text:"4", isCorrect:true}, {text:"1", isCorrect:false}, {text:"2", isCorrect:false}, {text:"6", isCorrect:false}], hint: "الـ 1 ليس أولياً ولا مؤلفاً. الـ 2 و 3 أعداد أولية. إذن أصغر عدد له أكثر من قاسمين هو الـ 4." },
                { q: "إذا علم أن a, b عددان صحيحان متتاليان، وأن c = ab، و N² = a² + b² + c²، فما نوع العدد N؟", options: [{text:"عدد فردي دائماً", isCorrect:true}, {text:"عدد زوجي دائماً", isCorrect:false}, {text:"مضاعف للعدد 4", isCorrect:false}, {text:"لا يمكن التحديد", isCorrect:false}], hint: "بما أن a,b متتاليان فمربعاتهما مجموعهما فردي. c زوجي فمربعه زوجي. (فردي + زوجي = فردي). N² فردي، إذن N فردي." },
                { q: "عددان أوليان p, q يحققان 5p + 7q = 129. ما هي القيم الممكنة للمقدار p + q؟", options: [{text:"19 أو 25", isCorrect:true}, {text:"23 فقط", isCorrect:false}, {text:"25 فقط", isCorrect:false}, {text:"29", isCorrect:false}], hint: "إذا كانت q=2 فإن 5p = 115 ومنها p=23 (المجموع 25). وإذا كانت p=2 فإن 7q=119 ومنها q=17 (المجموع 19)." }
            ],
            combinatorics: [
                { q: "يقدم مطعم شطائر بـ 3 أحجام، ويمكن طلبها بالجبن، أو بالطماطم، أو بدونهما. بكم طريقة يمكن طلب الشطيرة؟", options: [{text:"9 طرق", isCorrect:true}, {text:"3 طرق", isCorrect:false}, {text:"6 طرق", isCorrect:false}, {text:"12 طريقة", isCorrect:false}], hint: "مبدأ الضرب: لدينا 3 خيارات للحجم، و 3 خيارات للإضافة (جبن، طماطم، سادة). إذن 3 × 3 = 9 طرق." },
                { q: "يتسابق سلمان وأسامة وخالد. بكم طريقة سينتهي السباق إذا كان ممكناً أن يتعادل اثنان منهم أو أكثر؟", options: [{text:"13 طريقة", isCorrect:true}, {text:"6 طرق", isCorrect:false}, {text:"9 طرق", isCorrect:false}, {text:"27 طريقة", isCorrect:false}], hint: "بدون تعادل: 3! = 6 طرق. تعادل 2 وواحد مختلف: 3 × 2 = 6 طرق. تعادل الثلاثة معاً: طريقة واحدة. المجموع 6 + 6 + 1 = 13 طريقة." },
                { q: "بكم طريقة يمكن ترتيب 3 كتب رياضيات، 4 كتب كيمياء، و5 كتب فيزياء (مختلفة) على رف بشرط أن تكون كتب كل موضوع متجاورة؟", options: [{text:"103680", isCorrect:true}, {text:"17280", isCorrect:false}, {text:"5040", isCorrect:false}, {text:"34560", isCorrect:false}], hint: "نعتبر كل موضوع كتلة واحدة. ترتيب الـ 3 كتل هو 3!. وترتيب الكتب داخل كل كتلة هو 3! و 4! و 5!. الناتج = 3! × 3! × 4! × 5! = 103680." },
                { q: "كم عدد صحيح موجب ذو 4 خانات مختلفة يمكن تكوينه (بدون الصفر)؟", options: [{text:"4536", isCorrect:true}, {text:"3024", isCorrect:false}, {text:"5040", isCorrect:false}, {text:"9000", isCorrect:false}], hint: "لدينا 9 أرقام (بدون الصفر). الأولى بـ 9 طرق، والثانية 9 (لوجود الصفر)، والثالثة 8، والرابعة 7. إذن 9 × 9 × 8 × 7 = 4536." },
                { q: "كم عدد صحيح فردي موجب مكون من 5 خانات؟", options: [{text:"45000", isCorrect:true}, {text:"50000", isCorrect:false}, {text:"90000", isCorrect:false}, {text:"28125", isCorrect:false}], hint: "الخانة الأولى لها 9 خيارات. الخانات 2، 3، 4 لها 10 خيارات لكل منها. الخانة الأخيرة (للفردي) لها 5 خيارات (1,3,5,7,9). 9 × 10 × 10 × 10 × 5 = 45000." },
                { q: "كم عدد صحيح موجب أقل من 1000 لا يحتوي على الرقم 7؟", options: [{text:"728", isCorrect:true}, {text:"648", isCorrect:false}, {text:"729", isCorrect:false}, {text:"800", isCorrect:false}], hint: "الأعداد أقل من 1000 تتكون من 3 خانات كحد أقصى. لدينا 9 أرقام متاحة. عدد الخيارات = 9 × 9 × 9 = 729. نطرح العدد 000 (ليس موجباً)، يتبقى 728." },
                { q: "عند كتابة الأعداد من 1 إلى 100 كم مرة سنكرر كتابة الرقم 6؟", options: [{text:"20 مرة", isCorrect:true}, {text:"10 مرات", isCorrect:false}, {text:"19 مرة", isCorrect:false}, {text:"21 مرة", isCorrect:false}], hint: "الرقم 6 يظهر في الآحاد 10 مرات (6, 16, 26...). ويظهر في العشرات 10 مرات (60, 61, 62...). المجموع 10 + 10 = 20 مرة." },
                { q: "كم عدد الكلمات (ليس بالضرورة لها معنى) المكونة من ترتيب حروف كلمة PRODUCT؟", options: [{text:"5040", isCorrect:true}, {text:"720", isCorrect:false}, {text:"7", isCorrect:false}, {text:"40320", isCorrect:false}], hint: "الكلمة بها 7 حروف مختلفة. عدد طرق الترتيب هو مضروب 7 (7!) = 5040 كلمة." },
                { q: "كلمة مكونة فقط من A, B, C تسمى 'جيدة' إذا لم يأت A بعد B، ولا B بعد C، ولا C بعد A. كم عدد الكلمات الجيدة المكونة من 7 حروف؟", options: [{text:"192", isCorrect:true}, {text:"128", isCorrect:false}, {text:"2187", isCorrect:false}, {text:"384", isCorrect:false}], hint: "الحرف الأول له 3 خيارات. كل حرف تالي له خياران فقط (لأننا نستبعد الحرف الممنوع الذي يسبقه). إذن 3 × 2^6 = 3 × 64 = 192 كلمة." },
                { q: "من مجموعة تحتوي على 9 عناصر، كم عدد المجموعات الجزئية غير الخالية التي تحتوي على عدد زوجي من العناصر؟", options: [{text:"255", isCorrect:true}, {text:"256", isCorrect:false}, {text:"128", isCorrect:false}, {text:"127", isCorrect:false}], hint: "عدد المجموعات ذات الحجم الزوجي في مجموعة من n عنصر هو 2^(n-1). إذن 2^8 = 256. نطرح المجموعة الخالية (حجمها 0 وهو زوجي) يتبقى 255 مجموعة." }
            ]
        };

        const categoryNames = {
            algebra: "الجبر",
            geometry: "الهندسة",
            number_theory: "نظرية الأعداد",
            combinatorics: "التركيبات ومبادئ العد",
            exam: "الاختبار الشامل المتقدم"
        };

        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;
        
        let isExamMode = false;
        let examTimer;
        let timeLeft = 0; 

        // دالة لخلط المصفوفات (عشوائية الخيارات والأسئلة)
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function startPractice(category) {
            isExamMode = false;
            let catQuestions = JSON.parse(JSON.stringify(questionBank[category]));
            // خلط البنك وسحب 10 أسئلة عشوائية من القسم الواحد ليتجدد التدريب
            currentQuestions = shuffleArray(catQuestions).slice(0, 10);
            document.getElementById('q-category').innerText = categoryNames[category];
            initQuiz();
        }

        function startExam() {
            isExamMode = true;
            score = 0;
            let allQ = [];
            for (let cat in questionBank) { 
                allQ = allQ.concat(JSON.parse(JSON.stringify(questionBank[cat]))); 
            }
            // خلط البنك بالكامل وسحب 15 سؤال عشوائي للاختبار الشامل
            allQ = shuffleArray(allQ);
            currentQuestions = allQ.slice(0, 15); 
            
            document.getElementById('q-category').innerText = "🏆 " + categoryNames.exam + " 🏆";
            
            timeLeft = 20 * 60; // 20 دقيقة
            document.getElementById('timer-container').style.display = 'block';
            document.getElementById('timer-container').classList.remove('timer-warning');
            updateTimerDisplay();
            
            clearInterval(examTimer);
            examTimer = setInterval(timerTick, 1000);
            
            initQuiz();
        }

        function initQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('result-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            loadQuestion();
        }

        function timerTick() {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 60) {
                document.getElementById('timer-container').classList.add('timer-warning');
            }
            if (timeLeft <= 0) {
                clearInterval(examTimer);
                forceEndExam(true);
            }
        }

        function updateTimerDisplay() {
            let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            let s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('time-left').innerText = `${m}:${s}`;
        }

        function loadQuestion() {
            answered = false;
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('feedback-box').className = 'feedback';
            
            const qData = currentQuestions[currentQuestionIndex];
            document.getElementById('q-counter').innerText = `السؤال ${currentQuestionIndex + 1} / ${currentQuestions.length}`;
            document.getElementById('q-text').innerText = qData.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            // خلط الخيارات (أ، ب، ج، د) لضمان عدم حفظ الطالب لمكان الإجابة
            let shuffledOptions = shuffleArray([...qData.options]);
            
            shuffledOptions.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => checkAnswer(opt.isCorrect, btn, optionsContainer);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(isCorrect, btnElement, optionsContainer) {
            if(answered) return;
            answered = true;
            
            const options = optionsContainer.children;
            for(let btn of options) btn.disabled = true;

            const qData = currentQuestions[currentQuestionIndex];
            for(let btn of options) {
                let correctText = qData.options.find(o => o.isCorrect).text;
                if(btn.innerText === correctText) {
                    btn.classList.add('correct');
                }
            }
            
            const feedbackBox = document.getElementById('feedback-box');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackText = document.getElementById('feedback-text');
            
            if(isCorrect) {
                score++;
                feedbackBox.className = 'feedback feedback-success show';
                feedbackTitle.innerText = "إجابة صحيحة! تفكير أولمبي رائع 🏆";
            } else {
                btnElement.classList.add('wrong');
                feedbackBox.className = 'feedback feedback-error show';
                feedbackTitle.innerText = "إجابة خاطئة! الخدعة تكمن في التالي 💡";
            }
            
            feedbackText.innerText = qData.hint;
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if(currentQuestionIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function forceEndExam(timeout = false) {
            clearInterval(examTimer);
            if(timeout) alert("انتهى الوقت! سيتم سحب الورقة وعرض النتيجة.");
            showResult();
        }

        function showResult() {
            clearInterval(examTimer);
            document.getElementById('timer-container').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'none';
            document.getElementById('result-section').style.display = 'block';
            
            const total = currentQuestions.length;
            const percentage = Math.round((score / total) * 100);
            
            document.getElementById('final-score').innerText = `${percentage}%`;
            document.getElementById('score-fraction').innerText = `${score} من ${total}`;
            
            let msg = "";
            if(percentage === 100) msg = "أداء مثالي ومذهل! مستوى متقدم جداً يضمن لك حصد الميداليات في أولمبياد نسمو.";
            else if(percentage >= 70) msg = "أداء قوي في أسئلة التحدي! تحتاج فقط لمراجعة بسيطة لبعض الأفكار لتصل للعلامة الكاملة.";
            else msg = "أسئلة التحدي تحتاج لتركيز واستنتاج القواعد الخفية. اقرأ التوضيحات جيداً وحاول مجدداً لتطوير مهارتك.";
            
            document.getElementById('result-msg').innerText = msg;
        }

        function goHome() {
            clearInterval(examTimer);
            document.getElementById('timer-container').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'none';
            document.getElementById('result-section').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
        }
    </script>
</body>
