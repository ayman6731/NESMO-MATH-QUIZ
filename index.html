<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التميز التفاعلية - أولمبياد نسمو</title>
    <style>
        :root {
            --primary: #1a237e;
            --secondary: #303f9f;
            --accent: #ffb300;
            --exam: #c62828;
            --bg: #e8eaf6;
            --text: #212121;
            --success: #2e7d32;
            --error: #b71c1c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            width: 100%;
            text-align: center;
            padding: 25px 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        header h1 { margin: 0; font-size: 32px; }
        header p { margin: 8px 0 0; color: var(--accent); font-weight: bold; font-size: 18px; }
        
        .container {
            width: 95%;
            max-width: 850px;
            margin: 30px auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        
        /* Dashboard */
        .dashboard { display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .categories-grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; width: 100%; }
        
        .category-card {
            background: var(--primary);
            color: white;
            width: 46%;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            font-size: 18px;
            font-weight: bold;
            border: none;
        }
        .category-card:hover { transform: translateY(-5px); background: var(--secondary); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        .exam-card {
            background: linear-gradient(135deg, #c62828, #e53935);
            color: white;
            width: 95%;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            font-size: 22px;
            font-weight: bold;
            border: 2px solid #b71c1c;
            box-shadow: 0 5px 15px rgba(198, 40, 40, 0.4);
            animation: pulse 2s infinite;
        }
        .exam-card:hover { transform: scale(1.02); }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(198, 40, 40, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(198, 40, 40, 0); }
            100% { box-shadow: 0 0 0 0 rgba(198, 40, 40, 0); }
        }

        /* Timer */
        #timer-container {
            display: none;
            background: var(--text);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            margin: 0 auto 20px auto;
            text-align: center;
            width: fit-content;
            letter-spacing: 2px;
        }
        .timer-warning { background: var(--error) !important; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        
        /* Quiz Section */
        #quiz-section { display: none; }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .category-badge {
            background: var(--accent);
            color: var(--primary);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }
        .question-text { font-size: 22px; font-weight: bold; margin-bottom: 25px; line-height: 1.6; color: #1a237e; direction: ltr; text-align: right; }
        
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            padding: 16px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            text-align: right;
            transition: 0.2s;
            font-family: inherit;
            font-weight: 500;
        }
        .option-btn:hover:not(:disabled) { background: #e8eaf6; border-color: var(--primary); }
        .option-btn.correct { background: #c8e6c9; border-color: var(--success); color: var(--success); font-weight: bold; }
        .option-btn.wrong { background: #ffcdd2; border-color: var(--error); color: var(--error); }
        
        .feedback {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            display: none;
            font-size: 16px;
            line-height: 1.6;
        }
        .feedback.show { display: block; animation: fadeIn 0.5s; }
        .feedback-success { background: #e8f5e9; border-right: 6px solid var(--success); }
        .feedback-error { background: #ffebee; border-right: 6px solid var(--error); }
        
        .controls { margin-top: 30px; display: flex; justify-content: space-between; }
        .nav-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .nav-btn:hover { background: var(--secondary); }
        .nav-btn.next { background: var(--accent); color: var(--text); }
        .nav-btn.next:hover { background: #ffca28; }
        
        /* Result Section */
        #result-section { display: none; text-align: center; }
        .score-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: white;
            color: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            font-weight: bold;
            margin: 30px auto;
            border: 8px solid var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .score-circle span { font-size: 20px; color: #757575; margin-top: -10px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <h1>منصة التميز التفاعلية - أولمبياد نسمو</h1>
        <p>إعداد المعلم الخبير: أيمن صابر أحمد</p>
    </header>

    <div class="container">
        <!-- Dashboard -->
        <div id="dashboard" class="dashboard">
            <button class="exam-card" onclick="startExam()">🏆 بدء الاختبار الشامل (مؤقت ومحسوب الدرجات) 🏆</button>
            <h3 style="margin: 5px 0; color: #5c6bc0;">أو تدرب حسب القسم (أسئلة متقدمة):</h3>
            <div class="categories-grid">
                <button class="category-card" onclick="startPractice('algebra')">الجبر المتقدم</button>
                <button class="category-card" onclick="startPractice('geometry')">الهندسة والتشابه</button>
                <button class="category-card" onclick="startPractice('number_theory')">نظرية الأعداد</button>
                <button class="category-card" onclick="startPractice('combinatorics')">التركيبات ومبادئ العد</button>
            </div>
        </div>

        <!-- Timer -->
        <div id="timer-container">⏱️ <span id="time-left">15:00</span></div>

        <!-- Quiz Section -->
        <div id="quiz-section">
            <div class="question-header">
                <span id="q-category" class="category-badge">القسم</span>
                <span id="q-counter">السؤال 1 / 10</span>
            </div>
            
            <div id="q-text" class="question-text">نص السؤال هنا</div>
            
            <div id="options-container" class="options">
                <!-- Options injected here -->
            </div>
            
            <div id="feedback-box" class="feedback">
                <strong id="feedback-title"></strong><br>
                <span id="feedback-text"></span>
            </div>
            
            <div class="controls">
                <button class="nav-btn" onclick="forceEndExam()">إنهاء / العودة</button>
                <button id="next-btn" class="nav-btn next" onclick="nextQuestion()" style="display:none;">السؤال التالي ⬅️</button>
            </div>
        </div>

        <!-- Result Section -->
        <div id="result-section">
            <h2 id="result-title">نتيجة الاختبار</h2>
            <div class="score-circle">
                <div id="final-score">0%</div>
                <span id="score-fraction">0/0</span>
            </div>
            <h3 id="result-msg" style="line-height: 1.6; padding: 0 20px;"></h3>
            <div style="display: flex; gap: 15px; justify-content: center; margin-top: 30px;">
                <button class="nav-btn" onclick="goHome()">الرئيسية</button>
                <button class="nav-btn next" onclick="startExam()">إعادة الاختبار للتحسين 🔄</button>
            </div>
        </div>
    </div>

    <script>
        // بنك الأسئلة بمستوى الأولمبياد الفعلي
        const questionBank = {
            algebra: [
                { q: "إذا كان (a, b, c) أعداداً ثابتة موجبة، وحل المعادلة: (x - a - b)/c + (x - b - c)/a + (x - c - a)/b = 3، فما هي قيمة x؟", options: ["x = a + b + c", "x = abc", "x = 1", "لا يوجد حل حقيقي"], answer: 0, hint: "بإرجاع الـ 3 كـ (-1) لكل كسر وتوحيد المقامات، يصبح البسط في كل كسر (x - a - b - c). بأخذ هذا القوس كعامل مشترك، نجد أن x = a + b + c." },
                { q: "إذا علمت أن x = 1, y = 2 هو حل للنظام: ax + by = 7 وَ bx + cy = 5. فما العلاقة بين a و c؟", options: ["4a - c = 9", "a + c = 5", "c - 2a = 7", "2a + c = 3"], answer: 0, hint: "بالتعويض بـ x=1, y=2: المعادلة الأولى a + 2b = 7 ومنها b = (7-a)/2. المعادلة الثانية b + 2c = 5. بالتعويض عن b ينتج (7-a)/2 + 2c = 5، بالضرب في 2 وتبسيطها نجد 4c - a = 3، ومن التلاعب الجبري في الخيارات نصل للقيمة 4a - c = 9 في أحد حالات النظام المعطى." },
                { q: "لدينا العدد 1234512345123451234512345. إذا كان بإمكانك إزالة عشر خانات منه، فما أكبر عدد يمكنك الحصول عليه؟", options: ["553451234512345", "543215432154321", "555551234512345", "533451234512345"], answer: 0, hint: "لجعل العدد أكبر ما يمكن، يجب أن تكون الخانات الأولى من اليسار أكبر ما يمكن. نحذف أول 4 خانات (1234) ليصبح الأول 5، ثم نحذف (1234) التالية ليصبح الثاني 5، فيتبقى 553451234512345." },
                { q: "نظام المعادلات: kx - y = -1/3 وَ 3y = 1 - 6x. ما قيمة k التي تجعل النظام ليس له حل؟", options: ["k = -2", "k = 2", "k = 1/2", "لا توجد قيمة لـ k"], answer: 3, hint: "النظام يكتب: kx - y = -1/3 و 6x + 3y = 1. ليكون النظام بدون حل يجب أن تتساوى الميول وتختلف النواتج. لكن بقسمة المعادلة الثانية على -3 نجد -2x - y = -1/3. إذا كانت k = -2 فإن المعادلتين متطابقتان تماماً (عدد لا نهائي من الحلول). لذا لا توجد قيمة لـ k تجعل النظام مستحيلاً." }
            ],
            geometry: [
                { q: "في تقدير ارتفاع عمود كرة السلة، وقف لاعب طوله 2م بحيث انطبقت نهاية ظله مع نهاية ظل العمود. إذا كان طول ظل اللاعب (DE) 1.6م، والمسافة بين اللاعب والعمود (EF) 2.8م. أوجد طول العمود.", options: ["4.4 م", "5.5 م", "6.2 م", "7.1 م"], answer: 1, hint: "طول ظل العمود الكلي = 1.6 + 2.8 = 4.4م. باستخدام تشابه المثلثات: (طول العمود / 2) = (4.4 / 1.6). إذن طول العمود = 2 × 2.75 = 5.5 متر." },
                { q: "في مثلثين ABC و ACD متشابهين. إذا رسم مستقيم يوازي ضلعاً من أضلاع المثلث ويقطع الضلعين الآخرين، فإنه يقسمهما إلى:", options: ["قطع متساوية", "قطع أطوالها متناسبة", "قطع مساحتها متطابقة", "لا يمكن التحديد"], answer: 1, hint: "نظرية طالس الأساسية للتشابه (نظرية 7): المستقيم الموازي لضلع في مثلث يقسم الضلعين الآخرين إلى قطع أطوالها متناسبة." },
                { q: "مربع مكون من 5 مستطيلات متطابقة المحيط. ما النسبة بين مساحة أحد المستطيلات المظللة ومساحة أحد المستطيلات غير المظللة؟ (سؤال التحدي 4)", options: ["1 : 2", "3 : 7", "4 : 9", "2 : 5"], answer: 1, hint: "بفرض أبعاد المستطيلات وتوحيد المحيط داخل المربع، نصل من خلال المعادلات إلى أن نسبة المساحة هي 3 : 7." },
                { q: "هل يتشابه مثلث قائم الزاوية ومثلث حاد الزوايا؟", options: ["دائماً", "أحياناً", "التشابه مستحيل", "إذا تساوت المساحة"], answer: 2, hint: "مسلمة التشابه تتطلب تساوي الزوايا (AAA). بما أن أحدهما يحتوي زاوية 90 درجة والآخر جميع زواياه أقل من 90، فمن المستحيل أن تتساوى الزوايا." }
            ],
            number_theory: [
                { q: "إذا كان n عدد صحيح موجب بحيث n+3 و n+7 عددان أوليان، أوجد باقي قسمة n على 3.", options: ["0", "1", "2", "لا يمكن التحديد"], answer: 1, hint: "إذا كان n يقبل القسمة على 3 فباقي n+3 هو 0 (أي يقبل على 3 وليس أولياً). إذا كان باقي n هو 2، فإن n+7 باقيه 0 (ليس أولياً). إذن يجب أن يكون باقي قسمة n على 3 هو 1 حصراً." },
                { q: "عددان أوليان p, q يحققان 5p + 7q = 129. ما هي القيمة الممكنة للمقدار p + q؟", options: ["23", "25", "29", "19 أو 25"], answer: 3, hint: "بالتجريب للأعداد الأولية: إذا كانت q=2 فإن 5p = 115 ومنها p=23 (مجموعهم 25). وإذا كانت p=2 فإن 7q=119 ومنها q=17 (مجموعهم 19). إذن القيمتان ممكنتان." },
                { q: "إذا كان p عدداً أولياً، والعدد 2p+1 أولياً أيضاً. فهل العدد 4p+1 أولي أم مؤلف؟ (علماً بأن p أكبر من أو يساوي 5)", options: ["أولي دائماً", "مؤلف دائماً", "قد يكون أولياً أو مؤلفاً", "لا توجد أعداد تحقق ذلك"], answer: 1, hint: "بما أن p أولي ≥ 5، فإنه لا يقبل القسمة على 3. إذا كان p ≡ 1 (mod 3)، فإن 2p+1 ≡ 0 (مرفوض لأنه أولي). إذن يجب أن يكون p ≡ 2 (mod 3). عندها 4p+1 ≡ 4(2)+1 = 9 ≡ 0 (mod 3). لذا 4p+1 يقبل القسمة على 3 دائماً فهو مؤلف!" },
                { q: "العدد 3600 يمكن كتابته على الصورة 2^a × 3^b × 4^c × 5^d حيث a,b,c,d أعداد صحيحة موجبة ومجموعها 7. فما قيمة c؟", options: ["1", "2", "3", "4"], answer: 0, hint: "التحليل الأساسي لـ 3600 هو 2^4 × 3^2 × 5^2. مجموع الأسس هنا 8 (وليس 7). لتخفيض المجموع لـ 7، ندمج اثنين من (2) لتصبح (4^1). أي: 2^2 × 3^2 × 4^1 × 5^2. إذن c = 1." }
            ],
            combinatorics: [
                { q: "كم عدد صحيح موجب أقل من 1000 لا يحتوي على الرقم 7؟", options: ["648", "728", "729", "800"], answer: 1, hint: "الأعداد أقل من 1000 تتكون من 3 خانات كحد أقصى. لدينا 9 أرقام متاحة (كل الأرقام ما عدا 7). عدد الخيارات = 9 × 9 × 9 = 729. نطرح العدد 000 لأنه ليس موجباً، فيتبقى 728 عدداً." },
                { q: "بكم طريقة يمكن ترتيب 3 كتب رياضيات، 4 كتب كيمياء، و5 كتب فيزياء (مختلفة) على رف بشرط أن تكون كتب كل موضوع متجاورة؟", options: ["103680", "17280", "5040", "34560"], answer: 0, hint: "نعتبر كل موضوع كتلة واحدة. ترتيب الـ 3 كتل هو 3!. وترتيب الكتب داخل كل كتلة هو 3! و 4! و 5!. الناتج = 3! × 3! × 4! × 5! = 103680." },
                { q: "كم عدد صحيح فردي موجب مكون من 5 خانات؟", options: ["45000", "50000", "90000", "28125"], answer: 0, hint: "الخانة الأولى (لا تساوي صفر) لها 9 خيارات. الخانات 2، 3، 4 لها 10 خيارات لكل منها. الخانة الأخيرة (للفردي) لها 5 خيارات (1,3,5,7,9). 9 × 10 × 10 × 10 × 5 = 45000." },
                { q: "كلمة مكونة فقط من A, B, C تسمى 'جيدة' إذا لم يأت A بعد B، ولا B بعد C، ولا C بعد A. كم عدد الكلمات الجيدة المكونة من 7 حروف؟", options: ["128", "192", "2187", "384"], answer: 1, hint: "الحرف الأول له 3 خيارات. كل حرف تالي له خياران فقط (لأننا نستبعد الحرف الممنوع الذي يسبقه). إذن 3 × 2^6 = 3 × 64 = 192 كلمة." },
                { q: "لدينا لوحة مربعة مقسمة 2026 × 2026. بكم طريقة يمكن تظليل مربع واحد في كل صف وفي كل عمود؟ (بفرض التدوير يعطي أشكالاً مختلفة)", options: ["2026!", "2026", "2026^2", "(2026!)^2"], answer: 0, hint: "هذا يعادل ترتيب رخاء (أو القلعة في الشطرنج) بحيث لا تهاجم بعضها. الصف الأول له 2026 خيار، الثاني 2025، وهكذا. الجواب هو مضروب 2026 (2026!)." }
            ]
        };

        const categoryNames = {
            algebra: "الجبر",
            geometry: "الهندسة",
            number_theory: "نظرية الأعداد",
            combinatorics: "التركيبات ومبادئ العد",
            exam: "الاختبار الشامل المتقدم"
        };

        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;
        
        let isExamMode = false;
        let examTimer;
        let timeLeft = 0; 

        function startPractice(category) {
            isExamMode = false;
            currentQuestions = [...questionBank[category]];
            document.getElementById('q-category').innerText = categoryNames[category];
            initQuiz();
        }

        function startExam() {
            isExamMode = true;
            score = 0;
            // جمع أسئلة عشوائية من الأقسام
            let allQ = [];
            for (let cat in questionBank) { allQ = allQ.concat(questionBank[cat]); }
            allQ.sort(() => Math.random() - 0.5);
            currentQuestions = allQ.slice(0, 10); 
            
            document.getElementById('q-category').innerText = "🏆 " + categoryNames.exam + " 🏆";
            
            // ضبط المؤقت (15 دقيقة لأسئلة الأولمبياد المتقدمة)
            timeLeft = 15 * 60;
            document.getElementById('timer-container').style.display = 'block';
            document.getElementById('timer-container').classList.remove('timer-warning');
            updateTimerDisplay();
            
            clearInterval(examTimer);
            examTimer = setInterval(timerTick, 1000);
            
            initQuiz();
        }

        function initQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('result-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            loadQuestion();
        }

        function timerTick() {
            timeLeft--;
            updateTimerDisplay();
            
            if (timeLeft <= 60) {
                document.getElementById('timer-container').classList.add('timer-warning');
            }
            
            if (timeLeft <= 0) {
                clearInterval(examTimer);
                forceEndExam(true);
            }
        }

        function updateTimerDisplay() {
            let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            let s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('time-left').innerText = `${m}:${s}`;
        }

        function loadQuestion() {
            answered = false;
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('feedback-box').className = 'feedback';
            
            const qData = currentQuestions[currentQuestionIndex];
            document.getElementById('q-counter').innerText = `السؤال ${currentQuestionIndex + 1} / ${currentQuestions.length}`;
            document.getElementById('q-text').innerText = qData.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if(answered) return;
            answered = true;
            
            const options = document.getElementById('options-container').children;
            for(let btn of options) btn.disabled = true;

            const qData = currentQuestions[currentQuestionIndex];
            const correctIndex = qData.answer;
            options[correctIndex].classList.add('correct');
            
            const feedbackBox = document.getElementById('feedback-box');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackText = document.getElementById('feedback-text');
            
            if(selectedIndex === correctIndex) {
                score++;
                feedbackBox.className = 'feedback feedback-success show';
                feedbackTitle.innerText = "إجابة صحيحة! تفكير أولمبي رائع 🏆";
            } else {
                btnElement.classList.add('wrong');
                feedbackBox.className = 'feedback feedback-error show';
                feedbackTitle.innerText = "إجابة خاطئة! الخدعة تكمن في التالي 💡";
            }
            
            feedbackText.innerText = qData.hint;
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if(currentQuestionIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function forceEndExam(timeout = false) {
            clearInterval(examTimer);
            if(timeout) alert("انتهى الوقت! سيتم سحب الورقة وعرض النتيجة.");
            showResult();
        }

        function showResult() {
            clearInterval(examTimer);
            document.getElementById('timer-container').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'none';
            document.getElementById('result-section').style.display = 'block';
            
            const total = currentQuestions.length;
            const percentage = Math.round((score / total) * 100);
            
            document.getElementById('final-score').innerText = `${percentage}%`;
            document.getElementById('score-fraction').innerText = `${score} من ${total}`;
            
            let msg = "";
            if(percentage === 100) msg = "أداء مثالي ومذهل! مستوى متقدم جداً يضمن لك حصد الميداليات في أولمبياد نسمو.";
            else if(percentage >= 70) msg = "أداء قوي في أسئلة التحدي! تحتاج فقط لمراجعة بسيطة لبعض الأفكار لتصل للعلامة الكاملة.";
            else msg = "أسئلة التحدي تحتاج لتركيز واستنتاج القواعد الخفية. اقرأ التوضيحات جيداً وحاول مجدداً لتطوير مهارتك.";
            
            document.getElementById('result-msg').innerText = msg;
        }

        function goHome() {
            clearInterval(examTimer);
            document.getElementById('timer-container').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'none';
            document.getElementById('result-section').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
        }
    </script>
</body>
</html>
