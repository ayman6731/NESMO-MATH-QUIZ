<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التميز التفاعلية - أولمبياد نسمو</title>
    <style>
        :root {
            --primary: #4a148c;
            --secondary: #7c43bd;
            --accent: #ffb300;
            --bg: #f3e5f5;
            --text: #212121;
            --success: #2e7d32;
            --error: #c62828;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            width: 100%;
            text-align: center;
            padding: 20px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h1 { margin: 0; font-size: 28px; }
        header p { margin: 5px 0 0; color: var(--accent); font-weight: bold; }
        
        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        
        /* Dashboard / Categories */
        .dashboard { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .category-card {
            background: var(--primary);
            color: white;
            width: 45%;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            font-size: 18px;
            font-weight: bold;
            border: none;
        }
        .category-card:hover { transform: translateY(-5px); background: var(--secondary); }
        
        /* Quiz Section */
        #quiz-section { display: none; }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .category-badge {
            background: var(--accent);
            color: var(--primary);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }
        .question-text { font-size: 20px; font-weight: bold; margin-bottom: 20px; line-height: 1.6; }
        
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-btn {
            background: var(--bg);
            border: 2px solid transparent;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-align: right;
            transition: 0.3s;
            font-family: inherit;
        }
        .option-btn:hover { background: #e1bee7; }
        .option-btn.correct { background: #c8e6c9; border-color: var(--success); color: var(--success); }
        .option-btn.wrong { background: #ffcdd2; border-color: var(--error); color: var(--error); }
        
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 16px;
            line-height: 1.5;
        }
        .feedback.show { display: block; animation: fadeIn 0.5s; }
        .feedback-success { background: #e8f5e9; border-right: 5px solid var(--success); }
        .feedback-error { background: #ffebee; border-right: 5px solid var(--error); }
        
        .controls { margin-top: 25px; display: flex; justify-content: space-between; }
        .nav-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .nav-btn:hover { background: var(--secondary); }
        
        /* Result Section */
        #result-section { display: none; text-align: center; }
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            margin: 20px auto;
            border: 5px solid var(--accent);
        }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <h1>منصة التميز التفاعلية - أولمبياد نسمو</h1>
        <p>إعداد المعلم الخبير: أيمن صابر أحمد</p>
    </header>

    <div class="container">
        <!-- Dashboard -->
        <div id="dashboard" class="dashboard">
            <button class="category-card" onclick="startQuiz('algebra')">الجبر</button>
            <button class="category-card" onclick="startQuiz('geometry')">الهندسة</button>
            <button class="category-card" onclick="startQuiz('number_theory')">نظرية الأعداد</button>
            <button class="category-card" onclick="startQuiz('combinatorics')">التركيبات ومبادئ العد</button>
        </div>

        <!-- Quiz Section -->
        <div id="quiz-section">
            <div class="question-header">
                <span id="q-category" class="category-badge">القسم</span>
                <span id="q-counter">السؤال 1 / 5</span>
            </div>
            
            <div id="q-text" class="question-text">نص السؤال هنا</div>
            
            <div id="options-container" class="options">
                <!-- Options will be injected here -->
            </div>
            
            <div id="feedback-box" class="feedback">
                <strong id="feedback-title"></strong><br>
                <span id="feedback-text"></span>
            </div>
            
            <div class="controls">
                <button class="nav-btn" onclick="goHome()">الرئيسية</button>
                <button id="next-btn" class="nav-btn" onclick="next
